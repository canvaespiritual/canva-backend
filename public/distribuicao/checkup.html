  <style>
    html {
      min-height: 100%;
      scroll-behavior: smooth;
      background: #ffffff;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding:
        max(12px, env(safe-area-inset-top))
        12px
        max(32px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at top, rgba(37, 99, 235, 0.055), transparent 32%),
        #ffffff;
    }

    #quiz-container {
      width: 100%;
    }

    #quiz-container section {
      width: 100%;
    }

    .opcao {
      border: 1px solid rgba(15, 23, 42, 0.08);
      transition:
        background-color 160ms ease,
        border-color 160ms ease,
        transform 160ms ease;
    }

    .opcao:hover {
      border-color: rgba(37, 99, 235, 0.35);
      transform: translateY(-1px);
    }

    .opcao:focus-visible {
      outline: 3px solid rgba(37, 99, 235, 0.25);
      outline-offset: 2px;
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade {
      animation: fade 260ms ease both;
    }

    @media (min-width: 768px) {
      body {
        padding-top: 24px;
      }

      #quiz-container > section {
        border: 1px solid rgba(15, 23, 42, 0.07);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 18px 55px rgba(15, 23, 42, 0.08);
      }
    }

    @media (max-width: 480px) {
      body {
        padding-left: 4px;
        padding-right: 4px;
      }

      #quiz-container > section {
        padding-left: 14px;
        padding-right: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .animate-fade {
        animation: none;
      }

      .opcao {
        transition: none;
      }
    }
  </style>
</head>

<body class="text-gray-800 font-sans">

  <!-- Mantido porque o JavaScript original referencia este elemento. -->
  <section id="intro" class="hidden"></section>

  <div id="quiz-container"></div>

  <!--
    Reutiliza o arquivo de detalhes que já existe na raiz de public.
    Como esta página fica em public/distribuicao, usamos ../
  -->
  <script src="../frutos-detalhes.js"></script>

  <script src="./checkup.js"></script>

  <audio id="musicaAmbiente" loop preload="none">
    <source
      src="../assets/audio/som-ambiente.mp3"
      type="audio/mpeg"
    >
  </audio>

  <div
    id="controleSom"
    class="fixed bottom-4 right-4 z-50 opacity-0 transition-opacity duration-500"
  >
    <div class="relative flex items-center justify-center">
      <input
        type="range"
        id="volumeSlider"
        min="0"
        max="1"
        step="0.01"
        value="0.05"
        aria-label="Volume do som ambiente"
        class="hidden absolute bottom-[100px] w-24 h-2 rotate-[-90deg] origin-bottom bg-gray-300 rounded-full appearance-none cursor-pointer"
      >

      <button
        type="button"
        id="botaoSom"
        aria-label="Controlar som ambiente"
        class="bg-white bg-opacity-70 backdrop-blur-md shadow-lg p-3 rounded-full text-gray-700 hover:bg-opacity-100 transition"
      >
        🔊
      </button>
    </div>
  </div>

</body>
</html>
