<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Conheça uma nova forma de gerar renda | Canva Espiritual</title>

  <meta
    name="description"
    content="Assista à apresentação e faça uma experiência prática com o Check-up Emocional."
  >

  <style>
    :root {
      --background: #080b10;
      --surface: #111721;
      --surface-light: #171f2c;
      --text: #f7f8fa;
      --muted: #aab3c2;
      --primary: #f4c44e;
      --primary-hover: #ffd66b;
      --primary-text: #17130a;
      --border: rgba(255, 255, 255, 0.09);
      --shadow: rgba(0, 0, 0, 0.42);
      --max-width: 980px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      min-height: 100%;
      scroll-behavior: smooth;
      background: var(--background);
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--text);
      background:
        radial-gradient(
          circle at top,
          rgba(244, 196, 78, 0.08),
          transparent 34%
        ),
        var(--background);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    a {
      font: inherit;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      padding:
        max(18px, env(safe-area-inset-top))
        14px
        max(34px, env(safe-area-inset-bottom));
    }

    .container {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
    }

    .header {
      max-width: 760px;
      margin: 0 auto 18px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--primary);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .title {
      margin: 0;
      font-size: clamp(23px, 5.8vw, 38px);
      line-height: 1.15;
      font-weight: 850;
      letter-spacing: -0.025em;
    }

    .subtitle {
      max-width: 660px;
      margin: 12px auto 0;
      color: var(--muted);
      font-size: clamp(14px, 3.8vw, 17px);
      line-height: 1.55;
    }

    /*
      O vídeo enviado pela Vturb está em formato vertical 9:16.
      No celular ele ocupa praticamente toda a largura.
      No desktop fica centralizado, com largura máxima controlada.
    */
    .player-shell {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      padding: 5px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.035);
      box-shadow: 0 20px 60px var(--shadow);
    }

    .player-box {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 16px;
      background: #000;
    }

    .player-box vturb-smartplayer {
      display: block;
      width: 100% !important;
      max-width: none !important;
      margin: 0 auto;
    }

    .cta-area {
      width: 100%;
      max-width: 660px;
      margin: 24px auto 0;
      padding: 22px 18px;
      border: 1px solid rgba(244, 196, 78, 0.22);
      border-radius: 18px;
      background:
        linear-gradient(
          145deg,
          rgba(244, 196, 78, 0.1),
          rgba(255, 255, 255, 0.025)
        ),
        var(--surface);
      text-align: center;
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.28);
      animation: revealCta 0.5s ease both;
    }

    .cta-title {
      margin: 0;
      font-size: clamp(21px, 5vw, 28px);
      line-height: 1.2;
      font-weight: 850;
    }

    .cta-description {
      max-width: 540px;
      margin: 10px auto 18px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    .cta-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 58px;
      padding: 15px 22px;
      border: 0;
      border-radius: 999px;
      background: var(--primary);
      color: var(--primary-text);
      font-size: clamp(15px, 4vw, 17px);
      font-weight: 850;
      line-height: 1.2;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(244, 196, 78, 0.24);
      transition:
        transform 0.18s ease,
        background-color 0.18s ease,
        box-shadow 0.18s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .cta-button:hover {
      background: var(--primary-hover);
      box-shadow: 0 13px 34px rgba(244, 196, 78, 0.32);
      transform: translateY(-2px);
    }

    .cta-button:active {
      transform: translateY(0);
    }

    .cta-button:focus-visible {
      outline: 3px solid rgba(244, 196, 78, 0.38);
      outline-offset: 4px;
    }

    .security-note {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .waiting-message {
      margin: 15px auto 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      text-align: center;
    }

    .footer {
      margin: 32px 0 0;
      color: rgba(255, 255, 255, 0.4);
      font-size: 12px;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }
    .esconder {
  display: none !important;
}

    @keyframes revealCta {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (min-width: 768px) {
      .page {
        padding-top: 28px;
      }

      .header {
        margin-bottom: 22px;
      }

      .cta-area {
        padding: 28px;
      }
    }

    @media (max-width: 480px) {
      .page {
        padding-left: 10px;
        padding-right: 10px;
      }

      .header {
        padding: 0 6px;
      }

      .player-shell {
        padding: 3px;
        border-radius: 15px;
      }

      .player-box {
        border-radius: 12px;
      }

      .cta-area {
        margin-top: 18px;
        padding: 20px 14px;
        border-radius: 15px;
      }

      .cta-button {
        min-height: 56px;
        padding: 14px 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .cta-area {
        animation: none;
      }

      .cta-button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="container">

      <header class="header">
        <p class="eyebrow">Experiência prática</p>

        <h1 class="title">
          Veja como funciona uma nova forma de distribuição
        </h1>

        <p class="subtitle">
          
        </p>
      </header>

      <section
        class="player-shell"
        aria-label="Vídeo de apresentação"
      >
        <div class="player-box">

          <!-- Smartplayer Vturb — VSL parte 1 -->
          <vturb-smartplayer
            id="vid-6a5241c8ad6fc3b1add7597b"
            style="
              display: block;
              margin: 0 auto;
              width: 100%;
              max-width: 400px;
            "
          >
            <div
              class="vturb-player-placeholder"
              style="
                position: relative;
                width: 100%;
                padding: 177.77777777777777% 0 0;
                z-index: 0;
                background-color: black;
              "
            ></div>
          </vturb-smartplayer>

          <script type="text/javascript">
            (function loadVturbPlayer() {
              var script = document.createElement("script");

              script.src =
                "https://scripts.converteai.net/" +
                "ab0d5dbd-353e-4147-a5c6-52ab96121828/" +
                "players/6a5241c8ad6fc3b1add7597b/v4/player.js";

              script.async = true;
              document.head.appendChild(script);
            })();
          </script>

        </div>
      </section>

      <!--
        Este texto fica visível antes da liberação.
        Quando o botão aparecer, ele será ocultado.
      -->
      <p id="waitingMessage" class="waiting-message">
        
      </p>

      <!-- CTA inicialmente escondida -->
      <section
  id="ctaArea"
  class="cta-area esconder"
  aria-live="polite"
>
        <h2 class="cta-title">
          Agora faça você mesmo a experiência
        </h2>

        <p class="cta-description">
          Responda ao Check-up Emocional para conhecer, na prática,
          a experiência que você poderá apresentar para outras pessoas.
        </p>

        <a
          id="quizButton"
          class="cta-button"
          href="./checkup.html"
        >
          FAZER MEU CHECK-UP EMOCIONAL
        </a>

        <p class="security-note">
          
        </p>
      </section>

      <footer class="footer">
        © Canva Espiritual
      </footer>

    </div>
  </main>

  <script>
  (function configurarLiberacaoDoQuiz() {
    "use strict";

    /*
      TEMPO PARA O BOTÃO APARECER.

      Teste:
      10 segundos = 10

      Tempo definitivo:
      7 minutos e 42 segundos = 462
    */
    const REVEAL_AT_SECONDS = 462;

    const player = document.querySelector(
      "vturb-smartplayer"
    );

    const quizButton = document.getElementById(
      "quizButton"
    );

    /*
      Preserva UTMs, ref, vend e demais parâmetros
      ao avançar para o quiz.
    */
    if (quizButton && window.location.search) {
      quizButton.href =
        `./checkup.html${window.location.search}`;
    }

    if (!player) {
      console.error(
        "Smartplayer do Vturb não encontrado."
      );

      return;
    }

    /*
      Código oficial do Vturb.

      - começa a contar somente com o vídeo;
      - respeita play e pause;
      - libera no segundo configurado;
      - persist:true mantém liberado ao retornar.
    */
    player.addEventListener(
      "player:ready",
      function liberarConteudoNoTempoCerto() {
        player.displayHiddenElements(
          REVEAL_AT_SECONDS,
          [".esconder"],
          {
            persist: true
          }
        );
      }
    );
  })();
</script>
</body>
</html>
